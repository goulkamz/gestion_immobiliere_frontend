server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mêmes limites que le backend (uploads de médias)
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Compression des fichiers texte (les images sont déjà compressées)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/manifest+json;

    # Images du site (noms non empreints) : cache de 7 jours ; renommer un fichier pour forcer sa mise à jour
    location /images/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Fichiers générés avec empreinte : cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute autre route retombe sur index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
